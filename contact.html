<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PureGanic | Contact</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    <link rel="icon" href="Images/LogoWhite.svg">
</head>
<body>
    <header>
        <img class="LogoGreen" src="Images/LogoGreen.svg" alt="">
        <nav>
            <a href="index.html">HOME</a>
            <a href="Products.html">PRODUCTS</a>
            <a href="About.html">ABOUT</a>
            <a class="navSelected" href="Contact.html">CONTACT</a>
        </nav>
        <img id="brgrMenu" src="Images/Burger.svg" alt="">
    </header>

    <main>
        <section id="contactReach">
            <p class="secTitle">Reach out to us</p>
            <div class="contInfo">
                <div class="contCard">
                     <img src="Images/mail.svg" alt="">
                     <p class="contCardTitle">Email</p>
                     <div class="contCardContent">
                        <p>info@pureganic.com</p>
                        <p>support@pureganic.com</p>
                     </div>
                </div>
                <div class="contCard">
                    <img src="Images/phone.svg" alt="">
                    <p class="contCardTitle">phone</p>
                    <div class="contCardContent">
                       <p>+20 123 456 7890</p>
                       <p>Mon-Fri 9am-6pm</p>
                    </div>
               </div>
               <div class="contCard">
                    <img src="Images/location.svg" alt="">
                    <p class="contCardTitle">location</p>
                    <div class="contCardContent">
                    <p>Knowledge City</p>
                    <p>New Capital, Egypt</p>
                    </div>
                </div>
           </div>

           <div class="contMain">
                <div class="contForm">  
                    <p class="formTitle">Send us a message</p>
                    <form>
                        <div class="input">
                            <label for="name">Your Name</label>
                            <input id="name" type="text" placeholder="Enter your name">
                        </div>
                        <div class="input">
                            <label for="mail">Email Address</label>
                            <input id="mail" type="email" placeholder="Enter your email">
                        </div>
                        <div class="input">
                            <label for="subject">Subject</label>
                            <input id="subject" type="text" placeholder="What's this about?">
                        </div>
                        <div class="input">
                            <label for="message">Message</label>
                            <textarea name="message" id="message">Tell us what's on your mind...</textarea>
                        </div>
                    </form>
                    <button class="sendBtn">Send Message</button>
                </div>
           </div>

           <div class="faqs">
                <div></div>
           </div>
        </section>
    </main>
</body>
</html>
